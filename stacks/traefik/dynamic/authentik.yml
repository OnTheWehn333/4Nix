http:
  routers:
    authentik:
      rule: Host(`authentik.noahwehn.dev`)
      entryPoints:
        - websecure
      service: authentik
      tls:
        certResolver: letsencrypt

  services:
    authentik:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /-/health/ready/
          interval: 30s
          timeout: 5s
        servers:
          - url: http://10.100.0.10:9000
